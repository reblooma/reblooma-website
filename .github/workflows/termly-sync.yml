# Copies Reblooma's published Termly policies onto reblooma.com.
# Runs every day, and on demand from the Actions tab ("Run workflow").
# If a policy changed in Termly, this commits the new page to main, and
# GitHub Pages publishes it. If Termly can't be reached, nothing changes
# and the run is marked failed, so GitHub emails the repo owner.
name: Sync Termly policies

on:
  schedule:
    - cron: "17 14 * * *"   # 14:17 UTC = 6:17 AM Pacific (7:17 AM in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download policies from Termly
        id: sync
        continue-on-error: true
        run: python3 scripts/sync_termly.py

      - name: Commit changed pages
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No policy changes."
            exit 0
          fi
          git config user.name "reblooma-termly-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          git commit -m "Sync Termly policies ($(date -u +%m/%d/%Y))"
          git push origin HEAD:main

      - name: Mark the run failed if a policy could not be synced
        if: steps.sync.outcome == 'failure'
        run: |
          echo "At least one policy could not be downloaded or checked. Its last good page was kept."
          exit 1
