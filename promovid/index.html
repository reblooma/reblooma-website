<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reblooma</title>
<link rel="icon" type="image/png" href="/assets/brand/logo/reblooma-favicon.png">
<link rel="apple-touch-icon" href="/assets/brand/logo/reblooma-touch-icon.png">
<style>
  :root { --ground: #e4deda; --ink: #16181a; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: -apple-system, "Source Sans 3", Helvetica, Arial, sans-serif; display: grid; place-items: center; }
  main { width: 100%; max-width: 1200px; padding: 16px; box-sizing: border-box; display: grid; gap: 16px; justify-items: center; }
  img.logo { height: 36px; width: auto; }
  video { width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/brand/logo/reblooma-logo-colour-sm.png" alt="Reblooma">
  <video src="reblooma-promo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
</main>
</body>
</html>
